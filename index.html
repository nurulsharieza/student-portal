<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiMS Student Portal - Login</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

<div class="container-fluid">

    <div class="row min-vh-100">

        <!-- LEFT SIDE -->
        <div class="col-lg-7 d-none d-lg-flex left-panel">

            <div class="overlay"></div>

            <div class="left-content text-white">

                <h1 class="display-3 fw-bold">Welcome to AiMS Student Portal </h1>

                <p class="lead mt-3">
                    Association of Information Management System
                </p>

                <p class="mt-4">
                    "Small, But Significant"
                </p>

            </div>

        </div>

        <!-- RIGHT SIDE -->

        <div class="col-lg-5 d-flex align-items-center justify-content-center">

            <div class="login-card">

                <div class="text-center mb-4">

                    <i class="bi bi-person-circle login-icon"></i>

                    <h2 class="fw-bold mt-3">Member Login</h2>

                    <p class="text-muted">
                        Access the AiMS Club Portal
                    </p>

                </div>

                <div id="error-message"
                     class="alert alert-danger d-none">
                    Invalid Member ID or Password
                </div>

                <form onsubmit="login(event)">

                    <div class="mb-3">

                        <label class="form-label">
                            Member ID
                        </label>

                        <input type="text"
                               id="memberID"
                               class="form-control"
                               placeholder="Enter Member ID"
                               required>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Password
                        </label>

                        <input type="password"
                               id="password"
                               class="form-control"
                               placeholder="Enter Password"
                               required>

                    </div>

                    <button class="btn login-btn w-100">
                        Login
                    </button>

                </form>

                <div class="text-center mt-4">

                    <small class="text-muted">
                        Demo Login:
                        AIMS001 / aims2026
                    </small>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
